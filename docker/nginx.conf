# nginx serves the built sheet and nothing else — there is no API behind it.
# Traefik terminates TLS in front, which is what makes the origin secure enough
# for the service worker to register and the app to be installable.

types {
  # Not in nginx's default mime.types, and the browser ignores a manifest
  # served as anything else.
  application/manifest+json  webmanifest;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The .gz files are produced at build time; nginx serves them directly rather
  # than compressing per request.
  gzip_static on;
  gzip_vary on;

  # Only meaningful for anything that escaped precompression.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # Hashed filenames, so a given URL's contents can never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # These three decide what version of the app a returning visitor gets. Caching
  # them is how a PWA gets permanently stuck on an old build, so they always
  # revalidate.
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location /icons/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }

  # The sheet routes on the hash (`#demo`), so there are no real server-side
  # paths — anything unrecognised is still the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
